<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; user-select: none; }
  body {
    background: #03154A; color: #EAF1FF;
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", Tahoma, sans-serif;
    display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
    padding: 16px 16px 20px 14px; position: relative; cursor: default;
    border: 1px solid rgba(25,182,255,.55);
  }
  body::after {   /* خط السرعة من الأيقونة: يظهر في الأسفل ويتلوّن حسب الحالة */
    content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 5px;
    background: linear-gradient(270deg, #19B6FF, #1F6BFF);
  }
  body.done::after { background: #3DDC97; }
  body.error::after { background: #FF5C7A; }
  body.start::after { transform-origin: right; animation: run 8s linear forwards; }
  body.done { border-color: rgba(61,220,151,.7); }
  body.error { border-color: rgba(255,92,122,.75); }
  @keyframes run { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  img { width: 56px; height: 56px; border-radius: 14px; }
  .t { font-size: 14px; color: #8FA3D1; display: flex; gap: 8px; }
  .t b { color: #EAF1FF; font-weight: 600; }
  body.done .t b { color: #3DDC97; }
  body.error .t b { color: #FF7E95; }
  .n { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .e { color: #FF9FB0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .acts { display: flex; flex-direction: column; gap: 6px; align-self: stretch; justify-content: center; }
  button {
    font: inherit; color: #EAF1FF; background: rgba(255,255,255,.08); border: 0; border-radius: 7px;
    padding: 7px 16px; cursor: pointer; white-space: nowrap; font-size: 13.5px;
  }
  button:hover { background: rgba(25,182,255,.25); }
  button.primary { background: linear-gradient(90deg, #1F6BFF, #19B6FF); font-weight: 600; }
  .x { position: absolute; top: 4px; left: 6px; background: none; padding: 2px 6px; color: #8FA3D1; font-size: 15px; line-height: 1; }
  .x:hover { background: none; color: #fff; }
  .min { flex: 1; min-width: 0; }
  @media (prefers-reduced-motion: reduce) { body.start::after { animation: none; } }
</style>
</head>

<script>
const D = /*__DATA__*/null || { event: "start", name: "", path: "", error: "", size: 0, source: "" };
const $ = id => document.getElementById(id);
function size(n) { if (!n) return ""; const u = ["B","KB","MB","GB"]; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + " " + u[i]; }
document.body.className = D.event;
$("title").textContent = { start: "بدأ التحميل", done: "اكتمل التحميل", error: "فشل التحميل" }[D.event];
const meta = $("meta"); meta.dir = "ltr"; meta.style.unicodeBidi = "isolate";
meta.textContent = D.event === "done" ? size(D.size) : (D.event === "start" ? D.source : "");
const AR = /[\u0590-\u08FF]/;
const nm = $("name"); nm.title = D.name; nm.dir = AR.test(D.name) ? "rtl" : "ltr"; nm.style.textAlign = "right";
const m = D.name.match(/^(.*?)([^\s\u0590-\u08FF]*\.[A-Za-z0-9]{1,5})$/);       // الامتداد معزول حتى لا يصير "3.mp4" إلى "mp4.3"
const base = document.createElement("bdi"); base.textContent = m ? m[1] : D.name; nm.appendChild(base);
if (m) { const ext = document.createElement("bdi"); ext.dir = "ltr"; ext.textContent = m[2]; nm.appendChild(ext); }
if (D.event === "error" && D.error) {
  const e = $("err"); e.hidden = false; e.textContent = D.error; e.title = D.error;
  e.dir = AR.test(D.error) ? "rtl" : "ltr"; e.style.textAlign = "right";
}
const acts = D.event === "done"
  ? [["open", "فتح", true], ["folder", "المجلد"]]
  : [["show", D.event === "error" ? "التفاصيل" : "عرض", D.event === "error"]];
for (const [a, label, primary] of acts) {
  const b = document.createElement("button"); b.textContent = label; if (primary) b.className = "primary";
  b.onclick = () => call("act", a, D.path); $("acts").appendChild(b);
}
$("x").onclick = () => call("close");
function call(fn, ...args) { try { window.pywebview.api[fn](...args); } catch (e) {} }
</script>

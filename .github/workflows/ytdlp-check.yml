name: yt-dlp check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Get yt-dlp, ffmpeg and deno
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ffx; Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName .
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip denox
          .\yt-dlp.exe --version
      - name: Try variants
        shell: pwsh
        run: |
          $url = 'https://www.youtube.com/watch?v=UgUgz4T3_wc'
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0 Safari/537.36'
          $base = @('--no-playlist','--simulate','--no-warnings','--ffmpeg-location','ffmpeg.exe','-f','bv*+ba/b','--print','%(format_id)s %(height)sp')
          $cases = [ordered]@{
            'A: PyDM today (browser UA + Referer header), no JS runtime' = @('--user-agent',$ua,'--add-header',"Referer:$url") + $base
            'B: no custom headers, no JS runtime'                        = $base
            'C: no custom headers + deno'                                = @('--js-runtimes',"deno:$PWD\denox\deno.exe") + $base
            'D: PyDM headers + deno'                                     = @('--js-runtimes',"deno:$PWD\denox\deno.exe",'--user-agent',$ua,'--add-header',"Referer:$url") + $base
            'E: audio (bestaudio) no headers + deno'                     = @('--js-runtimes',"deno:$PWD\denox\deno.exe",'--no-playlist','--simulate','--no-warnings','-f','ba/b','--print','%(format_id)s %(acodec)s')
          }
          foreach ($k in $cases.Keys) {
            Write-Host "===== $k"
            $out = & .\yt-dlp.exe @($cases[$k]) $url 2>&1
            $out | Select-Object -Last 4 | ForEach-Object { Write-Host "   $_" }
          }

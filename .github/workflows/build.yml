name: Build PyDM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and pywebview
        run: pip install pyinstaller pywebview

      # نسخة مجلد (onedir): تبدأ أسرع ويقل حجبها من مضاد الفيروسات مقارنة بـ onefile
      - name: Build PyDM (folder)
        run: pyinstaller --noconfirm --onedir --windowed --name PyDM --icon assets/icon.ico --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets" --add-data "ui;ui" --collect-all webview --contents-directory lib pydm.py

      # ينجح فقط إذا فُتحت النافذة وحمّلت الواجهة، وظهرت نافذة معلومات الملف والإشعار فوق كل النوافذ
      - name: Smoke test (window, file-info dialog and notification)
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public class Win {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", EntryPoint="GetWindowLongPtrW")] static extern IntPtr GetWindowLongPtr(IntPtr h, int i);
            public static List<string> List(uint pid) {
              var r = new List<string>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid) { var sb = new StringBuilder(256); GetWindowTextW(h, sb, 256);
                if (sb.Length > 0) r.Add(sb.ToString() + "|visible=" + IsWindowVisible(h) + "|topmost=" + ((GetWindowLongPtr(h, -20).ToInt64() & 8) != 0)); } return true; }, IntPtr.Zero);
              return r; } }
          "@
          function Start-App {
            $p = Start-Process dist\PyDM\PyDM.exe -PassThru
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) { Write-Host "PyDM.exe exited with code $($p.ExitCode)"; return $null }
              try { if ((Invoke-WebRequest http://127.0.0.1:9614/ping -UseBasicParsing -TimeoutSec 2).Content -match '"ui": true') { return $p } } catch {}
            }
            return $p
          }
          function Wait-Window($p, $pattern) {     # نافذة ظاهرة وفوق الجميع يطابق عنوانها النمط
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              foreach ($w in [Win]::List($p.Id)) { if ($w -match $pattern -and $w -match 'visible=True\|topmost=True') { return $true } }
            }
            Write-Host "windows of the process:"; [Win]::List($p.Id) | ForEach-Object { Write-Host "   $_" }
            return $false
          }
          function Send-Download { Invoke-WebRequest http://127.0.0.1:9614/add -Method Post -ContentType 'application/json' -Headers @{Origin='chrome-extension://ci'} -Body '{"url":"http://127.0.0.1:9614/ping"}' -UseBasicParsing | Out-Null }
          function Show-Logs { foreach ($f in 'startup.log','error.log','crash.log') { $path = "$env:USERPROFILE\.pydm\$f"; if (Test-Path $path) { Write-Host "===== $f"; Get-Content $path } } }

          $p = Start-App
          $ui = $p -and ((Invoke-WebRequest http://127.0.0.1:9614/ping -UseBasicParsing).Content -match '"ui": true')
          $info = $false; $toast = $false
          if ($ui) {
            Send-Download
            $info = Wait-Window $p '^PyDM - '
            Write-Host "file-info dialog on top: $info"
          }
          if ($p) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Show-Logs
          if ($ui) {
            Start-Sleep -Seconds 2
            '{"ask": false}' | Set-Content "$env:USERPROFILE\.pydm\config.json" -Encoding utf8NoBOM    # تحميل مباشر: نختبر الإشعار
            $p = Start-App
            Send-Download
            $toast = Wait-Window $p '^PyDM-Toast'
            Write-Host "notification on top: $toast"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Show-Logs
            Remove-Item "$env:USERPROFILE\.pydm\config.json", "$env:USERPROFILE\.pydm\downloads.json" -ErrorAction SilentlyContinue
          }
          if (-not $ui) {
            Write-Host "===== .NET / application errors from the Windows event log"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime','Application Error' } | Select-Object -First 3 | ForEach-Object { $_.Message }
            throw "PyDM.exe started but the interface did not load"
          }
          if (-not $info) { throw "the file-info dialog did not appear on top" }
          if (-not $toast) { throw "the notification did not appear on top" }

      - name: Download yt-dlp, ffmpeg and deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          function Get-File($url, $out) {   # إعادة المحاولة: أخطاء الشبكة المؤقتة لا تُفشل البناء
            for ($i = 1; $i -le 4; $i++) {
              try { Invoke-WebRequest $url -OutFile $out -TimeoutSec 300; return } catch { Write-Host "attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $i) }
            }
            throw "download failed: $url"
          }
          Get-File https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe tools\yt-dlp.exe
          Get-File https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          Copy-Item (Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName tools\ffmpeg.exe
          # Deno: يوتيوب يتطلب محرك جافاسكربت ليفك yt-dlp تحدّيه
          Get-File https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip deno.zip
          Expand-Archive deno.zip -DestinationPath deno_x
          Copy-Item deno_x\deno.exe tools\deno.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\PyDM.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test silent install (no admin)
        shell: pwsh
        run: |
          # -Wait would also wait for PyDM.exe, which the installer starts at the end; wait for the installer only
          $p = Start-Process dist\PyDM-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
          if (-not $p.WaitForExit(180000)) { throw "installer did not finish in 3 minutes" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest http://127.0.0.1:9614/ping -UseBasicParsing -TimeoutSec 2).Content -match '"ui": true') { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw "installed PyDM did not open after a silent install" }
          Write-Host "Installed PyDM is running and its interface loaded"
          $exe = "$env:LOCALAPPDATA\Programs\PyDM\PyDM.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\PyDM" | Select-Object Name
          Get-Process PyDM -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Package
        shell: pwsh
        run: |
          Copy-Item installer\install-silent.cmd dist\
          Compress-Archive -Path dist\PyDM\* -DestinationPath dist\PyDM-portable.zip
          Compress-Archive -Path extension\* -DestinationPath dist\PyDM-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PyDM
          path: |
            dist/PyDM-Setup.exe
            dist/install-silent.cmd
            dist/PyDM-portable.zip
            dist/PyDM-extension.zip

      # كل دفع إلى main يحدّث إصدار النسخة الحالية (الرقم من installer/PyDM.iss)
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path installer\PyDM.iss -Pattern '#define AppVersion "([^"]+)"' | Select-Object -First 1
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PyDM ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            ## التثبيت
            1. حمّل `PyDM-Setup.exe` وشغّله. لا يحتاج صلاحيات المدير، ويضم yt-dlp وffmpeg وDeno.
               - للتثبيت الصامت: ضع `install-silent.cmd` بجانبه وشغّله.
            2. إضافة المتصفح: بعد التثبيت تجدها في `%LOCALAPPDATA%\Programs\PyDM\extension`.
               من `chrome://extensions` فعّل وضع المطوّر ثم «تحميل إضافة غير مضغوطة» واختر المجلد.
               عند التحديث اضغط إعادة التحميل ↻ على الإضافة.

            `PyDM-portable.zip` نسخة تعمل بلا تثبيت، و`PyDM-extension.zip` الإضافة وحدها.
          files: |
            dist/PyDM-Setup.exe
            dist/install-silent.cmd
            dist/PyDM-portable.zip
            dist/PyDM-extension.zip

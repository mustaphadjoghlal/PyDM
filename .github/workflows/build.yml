name: Build PyDM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and pywebview
        run: pip install pyinstaller pywebview

      # نسخة مجلد (onedir): تبدأ أسرع ويقل حجبها من مضاد الفيروسات مقارنة بـ onefile
      - name: Build PyDM (folder)
        run: pyinstaller --noconfirm --onedir --windowed --name PyDM --icon assets/icon.ico --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets" --add-data "ui;ui" --collect-all webview --contents-directory lib pydm.py

      # ينجح فقط إذا فُتحت النافذة وحمّلت الواجهة (ui=true)، وليس مجرد بدء الخادم
      - name: Smoke test (window opens and the interface loads)
        shell: pwsh
        run: |
          $p = Start-Process dist\PyDM\PyDM.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { Write-Host "PyDM.exe exited with code $($p.ExitCode)"; break }
            try {
              $r = Invoke-WebRequest http://127.0.0.1:9614/ping -UseBasicParsing -TimeoutSec 2
              Write-Host "ping: $($r.Content)"
              if ($r.Content -match '"ui": true') { $ok = $true; break }
            } catch { Write-Host "ping failed: $($_.Exception.Message)" }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          foreach ($f in 'startup.log','error.log','crash.log') {
            $path = "$env:USERPROFILE\.pydm\$f"
            if (Test-Path $path) { Write-Host "===== $f"; Get-Content $path }
          }
          if (-not $ok) {
            Write-Host "===== .NET / application errors from the Windows event log"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime','Application Error' } |
              Select-Object -First 3 | ForEach-Object { $_.Message }
            Write-Host "===== bundled webview / pythonnet files"
            Get-ChildItem dist\PyDM\lib -Recurse -Include *.dll | Where-Object { $_.FullName -match 'webview|pythonnet|clr' } | ForEach-Object { $_.FullName.Replace((Resolve-Path dist\PyDM).Path, '') }
            Write-Host "===== same code from source (not frozen)"
            Remove-Item "$env:USERPROFILE\.pydm\startup.log" -ErrorAction SilentlyContinue
            $q = Start-Process python -ArgumentList 'pydm.py' -PassThru -RedirectStandardError src_err.txt -RedirectStandardOutput src_out.txt
            $src = $false
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              if ($q.HasExited) { Write-Host "source run exited with code $($q.ExitCode)"; break }
              try { $r = Invoke-WebRequest http://127.0.0.1:9614/ping -UseBasicParsing -TimeoutSec 2; if ($r.Content -match '"ui": true') { $src = $true; break } } catch {}
            }
            Stop-Process -Id $q.Id -Force -ErrorAction SilentlyContinue
            Write-Host "source run interface loaded: $src"
            Get-Content "$env:USERPROFILE\.pydm\startup.log" -ErrorAction SilentlyContinue
            Get-Content src_err.txt -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw "PyDM.exe started but the interface did not load"
          }

      - name: Download yt-dlp and ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools\yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          Copy-Item (Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName tools\ffmpeg.exe

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\PyDM.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test silent install (no admin)
        shell: pwsh
        run: |
          $p = Start-Process dist\PyDM-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\PyDM\PyDM.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\PyDM" | Select-Object Name
          Get-Process PyDM -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Package
        shell: pwsh
        run: |
          Copy-Item installer\install-silent.cmd dist\
          Compress-Archive -Path dist\PyDM\* -DestinationPath dist\PyDM-portable.zip
          Compress-Archive -Path extension\* -DestinationPath dist\PyDM-extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PyDM
          path: |
            dist/PyDM-Setup.exe
            dist/install-silent.cmd
            dist/PyDM-portable.zip
            dist/PyDM-extension.zip

      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PyDM-Setup.exe
            dist/install-silent.cmd
            dist/PyDM-portable.zip
            dist/PyDM-extension.zip
